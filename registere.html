<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Create your verified Loveroyality profile."
  >

  <title>Create Profile — Loveroyality</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .register-page {
      min-height: calc(100vh - 76px);
      padding: 55px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(246, 220, 229, 0.75),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 70%,
          rgba(215, 173, 98, 0.12),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #fffaf7 0%,
          #fff1f5 50%,
          #fffaf7 100%
        );
    }

    .register-card {
      width: 100%;
      max-width: 510px;
      padding: 38px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(91, 16, 38, 0.1);
      border-radius: 26px;
      box-shadow: 0 25px 70px rgba(91, 16, 38, 0.13);
      backdrop-filter: blur(18px);
    }

    .register-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .register-heart {
      width: 58px;
      height: 58px;
      margin: 0 auto 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: linear-gradient(
        135deg,
        #fff0f4,
        #f8dce6
      );
      font-size: 25px;
      box-shadow: 0 10px 25px rgba(201, 79, 114, 0.12);
    }

    .register-header h1 {
      color: var(--burgundy);
      font-size: 31px;
      letter-spacing: -1px;
      margin-bottom: 7px;
    }

    .register-header p {
      color: var(--muted);
      font-size: 13px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: var(--burgundy);
      font-size: 12px;
      font-weight: 700;
    }

    .form-input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1px solid rgba(91, 16, 38, 0.13);
      border-radius: 12px;
      outline: none;
      background: #fffafa;
      color: var(--text);
      font-size: 14px;
      transition: 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--rose);
      background: #fff;
      box-shadow:
        0 0 0 4px rgba(201, 79, 114, 0.08);
    }

    .phone-row {
      display: flex;
      gap: 8px;
    }

    .country-code {
      width: 92px;
      flex-shrink: 0;
      height: 50px;
      padding: 0 10px;
      border: 1px solid rgba(91, 16, 38, 0.13);
      border-radius: 12px;
      background: #fffafa;
      color: var(--burgundy);
      outline: none;
      font-size: 13px;
      font-weight: 700;
    }

    .phone-input {
      flex: 1;
    }

    .privacy-box {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      margin: 20px 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .privacy-box input {
      margin-top: 3px;
      accent-color: var(--rose);
    }

    .privacy-box a {
      color: var(--wine);
      font-weight: 700;
    }

    .create-button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 13px;
      background:
        linear-gradient(
          135deg,
          var(--burgundy),
          var(--wine)
        );
      color: white;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow:
        0 12px 28px rgba(91, 16, 38, 0.22);
      transition: 0.25s ease;
    }

    .create-button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 16px 32px rgba(91, 16, 38, 0.28);
    }

    .login-link {
      margin-top: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    .login-link a {
      color: var(--wine);
      font-weight: 800;
    }

    .verification-note {
      margin-top: 22px;
      padding: 13px 15px;
      border-radius: 13px;
      background: #fff5f8;
      border: 1px solid rgba(201, 79, 114, 0.1);
      color: #765c66;
      font-size: 11px;
      line-height: 1.55;
    }

    .verification-note strong {
      color: var(--burgundy);
    }

    @media (max-width: 520px) {
      .register-page {
        padding: 30px 14px;
      }

      .register-card {
        padding: 27px 20px;
        border-radius: 21px;
      }

      .register-header h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">

    <a href="index.html" class="logo">
      Loveroyality
    </a>

    <nav>
      <a href="login.html">Login</a>
      <a href="index.html" class="nav-button">Home</a>
    </nav>

  </header>

  <main class="register-page">

    <section class="register-card">

      <div class="register-header">

        <div class="register-heart">
          ❤️
        </div>

        <h1>Create Your Profile</h1>

        <p>
          Join Loveroyality with a verified profile.
        </p>

      </div>

      <form id="registerForm">

        <div class="form-group">

          <label for="fullName">
            Full Name
          </label>

          <input
            id="fullName"
            class="form-input"
            type="text"
            placeholder="Enter your name"
            autocomplete="name"
            maxlength="60"
            required
          >

        </div>

        <div class="form-group">

          <label for="username">
            Username
          </label>

          <input
            id="username"
            class="form-input"
            type="text"
            placeholder="Choose a username"
            autocomplete="username"
            maxlength="30"
            required
          >

        </div>

        <div class="form-group">

          <label for="phone">
            Phone Number
          </label>

          <div class="phone-row">

            <select
              id="countryCode"
              class="country-code"
              aria-label="Country code"
            >
              <option value="+880">🇧🇩 +880</option>
              <option value="+91">🇮🇳 +91</option>
              <option value="+92">🇵🇰 +92</option>
              <option value="+1">🇺🇸 +1</option>
              <option value="+44">🇬🇧 +44</option>
            </select>

            <input
              id="phone"
              class="form-input phone-input"
              type="tel"
              placeholder="1XXXXXXXXX"
              autocomplete="tel"
              maxlength="15"
              required
            >

          </div>

        </div>

        <div class="form-group">

          <label for="facebook">
            Facebook Profile URL
          </label>

          <input
            id="facebook"
            class="form-input"
            type="url"
            placeholder="https://facebook.com/yourprofile"
            autocomplete="url"
            required
          >

        </div>

        <div class="form-group">

          <label for="password">
            Account Password
          </label>

          <input
            id="password"
            class="form-input"
            type="password"
            placeholder="Create a strong password"
            autocomplete="new-password"
            minlength="8"
            required
          >

        </div>

        <div class="privacy-box">

          <input
            id="agreement"
            type="checkbox"
            required
          >

          <label for="agreement">
            I confirm that these are my own details and I agree
            to make the selected profile information searchable
            according to Loveroyality's privacy rules.
          </label>

        </div>

        <button
          type="submit"
          class="create-button"
        >
          Continue to Phone Verification
        </button>

      </form>

      <div class="verification-note">
        <strong>🔐 Phone verification required</strong><br>
        After registration, your phone number will be verified
        using a one-time password (OTP). Profile changes will
        also require verification.
      </div>

      <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

    </section>

  </main>

  <script>

    document
      .getElementById("registerForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const fullName =
          document.getElementById("fullName").value.trim();

        const username =
          document.getElementById("username").value.trim();

        const countryCode =
          document.getElementById("countryCode").value;

        const phone =
          document.getElementById("phone").value.trim();

        const facebook =
          document.getElementById("facebook").value.trim();

        const password =
          document.getElementById("password").value;

        const agreement =
          document.getElementById("agreement").checked;

        if (!agreement) {
          alert("Please accept the privacy agreement.");
          return;
        }

        if (password.length < 8) {
          alert("Password must be at least 8 characters.");
          return;
        }

        if (!/^https?:\\/\\/(www\\.)?facebook\\.com\\//i.test(facebook)) {
          alert("Please enter a valid Facebook profile URL.");
          return;
        }

        const fullPhone =
          countryCode + phone.replace(/^0+/, "");

        const profileData = {
          fullName: fullName,
          username: username,
          phone: fullPhone,
          facebook: facebook
        };

        localStorage.setItem(
          "loveroyality_pending_profile",
          JSON.stringify(profileData)
        );

        window.location.href = "login.html";

      });

  </script>

</body>
</html>
