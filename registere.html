<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Profile — Loveroyality</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <a href="index.html" class="logo">Loveroyality</a>

  <nav>
    <a href="login.html">Login</a>
    <a href="register.html" class="nav-btn">Create Profile</a>
  </nav>
</header>

<main class="auth-page">

  <section class="auth-card">

    <div class="auth-heading">
      <span class="auth-icon">♥</span>
      <h1>Create Your Profile</h1>
      <p>Create a verified relationship profile on Loveroyality.</p>
    </div>

    <form id="registerForm">

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          placeholder="Enter your full name"
          required
        >
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          placeholder="Choose a username"
          required
        >
      </div>

      <div class="form-group">
        <label for="phoneNumber">Phone Number</label>

        <div class="phone-row">
          <select id="countryCode">
            <option value="+880">🇧🇩 +880</option>
            <option value="+91">🇮🇳 +91</option>
            <option value="+92">🇵🇰 +92</option>
            <option value="+1">🇺🇸 +1</option>
            <option value="+44">🇬🇧 +44</option>
          </select>

          <input
            type="tel"
            id="phoneNumber"
            placeholder="1XXXXXXXXX"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="facebookUrl">Facebook Profile URL</label>
        <input
          type="url"
          id="facebookUrl"
          placeholder="https://facebook.com/yourprofile"
        >
      </div>

      <label class="check-row">
        <input type="checkbox" id="privacyAgree" required>
        <span>
          I confirm that the information belongs to me and I agree
          to have my profile searchable under Loveroyality's privacy rules.
        </span>
      </label>

      <div id="recaptcha-container"></div>

      <button
        type="submit"
        id="sendOtpBtn"
        class="primary-btn"
      >
        Continue to Phone Verification
      </button>

    </form>

    <div id="otpSection" class="otp-section" style="display:none;">

      <div class="otp-heading">
        <h2>Verify Your Phone</h2>
        <p>Enter the 6-digit OTP sent to your phone.</p>
      </div>

      <form id="otpForm">

        <div class="form-group">
          <label for="otpCode">Verification Code</label>

          <input
            type="text"
            id="otpCode"
            inputmode="numeric"
            maxlength="6"
            placeholder="000000"
            autocomplete="one-time-code"
            required
          >
        </div>

        <button
          type="submit"
          class="primary-btn"
        >
          Verify & Create Profile
        </button>

      </form>

      <button
        type="button"
        id="resendOtpBtn"
        class="secondary-btn"
      >
        Resend OTP
      </button>

    </div>

    <div class="auth-footer">
      Already have a profile?
      <a href="login.html">Login</a>
    </div>

  </section>

</main>

<script type="module">

import {
  auth,
  sendOTP,
  verifyOTP,
  saveProfile
} from "./firebase.js";

const registerForm = document.getElementById("registerForm");
const otpSection = document.getElementById("otpSection");
const otpForm = document.getElementById("otpForm");
const resendOtpBtn = document.getElementById("resendOtpBtn");

let confirmationResult = null;
let phoneForOtp = "";

function normalizePhone(countryCode, phone) {

  phone = phone.replace(/\D/g, "");

  if (phone.startsWith("0")) {
    phone = phone.substring(1);
  }

  return countryCode + phone;
}

function normalizeFacebookUrl(url) {

  if (!url) return "";

  try {

    const parsed = new URL(url.trim());

    let host = parsed.hostname.toLowerCase();

    if (host === "www.facebook.com") {
      host = "facebook.com";
    }

    if (
      host !== "facebook.com" &&
      host !== "m.facebook.com"
    ) {
      return "";
    }

    const path = parsed.pathname.replace(/\/+$/, "");

    return `https://${host}${path}`.toLowerCase();

  } catch {
    return "";
  }
}

function message(text, type = "info") {

  const old = document.querySelector(".app-message");

  if (old) old.remove();

  const box = document.createElement("div");

  box.className = `app-message ${type}`;
  box.textContent = text;

  document.body.prepend(box);

  setTimeout(() => {
    box.remove();
  }, 4000);
}

async function sendVerificationCode() {

  const countryCode =
    document.getElementById("countryCode").value;

  const phone =
    document.getElementById("phoneNumber").value.trim();

  phoneForOtp = normalizePhone(countryCode, phone);

  if (phoneForOtp.length < 8) {

    message(
      "Please enter a valid phone number.",
      "error"
    );

    return;
  }

  const sendButton =
    document.getElementById("sendOtpBtn");

  sendButton.disabled = true;
  sendButton.textContent = "Sending OTP...";

  try {

    confirmationResult =
      await sendOTP(
        phoneForOtp,
        "sendOtpBtn"
      );

    registerForm.style.display = "none";
    otpSection.style.display = "block";

    message(
      "OTP sent successfully.",
      "success"
    );

  } catch (error) {

    console.error(error);

    sendButton.disabled = false;
    sendButton.textContent =
      "Continue to Phone Verification";

    message(
      error.message ||
      "Unable to send OTP. Please try again.",
      "error"
    );
  }
}

registerForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const fullName =
      document.getElementById("fullName").value.trim();

    const username =
      document.getElementById("username").value.trim();

    const countryCode =
      document.getElementById("countryCode").value;

    const phone =
      document.getElementById("phoneNumber").value.trim();

    const facebookUrl =
      document.getElementById("facebookUrl").value.trim();

    const privacy =
      document.getElementById("privacyAgree").checked;

    if (!fullName || !username || !phone) {

      message(
        "Please complete all required fields.",
        "error"
      );

      return;
    }

    if (!privacy) {

      message(
        "Please accept the privacy agreement.",
        "error"
      );

      return;
    }

    let facebookNormalized = "";

    if (facebookUrl) {

      facebookNormalized =
        normalizeFacebookUrl(facebookUrl);

      if (!facebookNormalized) {

        message(
          "Please enter a valid Facebook profile URL.",
          "error"
        );

        return;
      }
    }

    await sendVerificationCode();
  }
);

otpForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const code =
      document.getElementById("otpCode").value.trim();

    if (code.length !== 6) {

      message(
        "Please enter the 6-digit OTP.",
        "error"
      );

      return;
    }

    const verifyButton =
      otpForm.querySelector("button[type='submit']");

    verifyButton.disabled = true;
    verifyButton.textContent = "Verifying...";

    try {

      if (!confirmationResult) {
        throw new Error("OTP session expired. Please request a new OTP.");
      }

      const result =
        await confirmationResult.confirm(code);

      const user = result.user;

      const fullName =
        document.getElementById("fullName").value.trim();

      const username =
        document.getElementById("username").value.trim();

      const facebookUrl =
        document.getElementById("facebookUrl").value.trim();

      const facebookNormalized =
        normalizeFacebookUrl(facebookUrl);

      await saveProfile(user.uid, {

        fullName,
        username,

        phone: phoneForOtp,
        phoneNormalized: phoneForOtp,

        facebookUrl,
        facebookUrlNormalized: facebookNormalized,

        phoneVerified: true,

        publicSearch: true,

        profileStatus: "active",

        partnerName: "",

        relationshipStatus: "Single / Not specified"

      });

      message(
        "Profile created successfully!",
        "success"
      );

      setTimeout(() => {

        window.location.href =
          `profile.html?uid=${encodeURIComponent(user.uid)}`;

      }, 1000);

    } catch (error) {

      console.error(error);

      verifyButton.disabled = false;
      verifyButton.textContent =
        "Verify & Create Profile";

      message(
        error.message ||
        "OTP verification failed.",
        "error"
      );
    }
  }
);

resendOtpBtn.addEventListener(
  "click",
  async function() {

    if (!phoneForOtp) return;

    try {

      confirmationResult =
        await sendOTP(
          phoneForOtp,
          "resendOtpBtn"
        );

      message(
        "A new OTP has been sent.",
        "success"
      );

    } catch (error) {

      console.error(error);

      message(
        error.message ||
        "Unable to resend OTP.",
        "error"
      );
    }
  }
);

</script>

</body>
</html>
