<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Search Profiles — Loveroyality</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .search-page {
      min-height: calc(100vh - 76px);
      padding: 55px 20px;
    }

    .search-container {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    .search-card {
      padding: 35px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: var(--shadow);
    }

    .search-heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .search-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--pink);
      color: var(--wine);
      font-size: 25px;
    }

    .search-heading h1 {
      margin-bottom: 7px;
      color: var(--burgundy);
      font-size: 30px;
    }

    .search-heading p {
      color: var(--muted);
      font-size: 14px;
    }

    .search-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 18px;
      padding: 5px;
      background: var(--soft-pink);
      border-radius: 14px;
    }

    .search-tab {
      min-height: 43px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      transition: 0.2s ease;
    }

    .search-tab.active {
      background: var(--white);
      color: var(--burgundy);
      box-shadow: 0 5px 15px rgba(91, 16, 38, 0.08);
    }

    .search-input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .search-input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 13px;
      outline: none;
      background: var(--white);
      color: var(--text);
    }

    .search-input:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 4px rgba(201, 79, 114, 0.1);
    }

    .search-btn {
      min-width: 120px;
      padding: 0 18px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(
        135deg,
        var(--burgundy),
        var(--wine)
      );
      color: var(--white);
      font-size: 13px;
      font-weight: 800;
    }

    .search-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .search-note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      line-height: 1.6;
    }

    .results {
      margin-top: 22px;
    }

    .results-title {
      margin-bottom: 13px;
      color: var(--burgundy);
      font-size: 18px;
    }

    .result-facebook {
      display: inline-block;
      margin-top: 4px;
      color: var(--wine);
      font-size: 11px;
      font-weight: 700;
    }

    .result-facebook:hover {
      text-decoration: underline;
    }

    .search-error {
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 13px;
      background: #fde8ed;
      color: #8b1837;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    @media (max-width: 700px) {
      .search-page {
        min-height: calc(100vh - 68px);
        padding: 28px 14px;
      }

      .search-card {
        padding: 25px 18px;
        border-radius: 21px;
      }

      .search-heading h1 {
        font-size: 25px;
      }

      .search-input-row {
        grid-template-columns: 1fr;
      }

      .search-btn {
        width: 100%;
        height: 50px;
      }
    }
  </style>
</head>

<body>

<header class="navbar">

  <a href="index.html" class="logo">
    Loveroyality ❤️
  </a>

  <nav>
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
    <a href="register.html" class="nav-btn">Create Profile</a>
  </nav>

</header>

<main class="search-page">

  <div class="search-container">

    <section class="search-card">

      <div class="search-heading">

        <div class="search-icon">
          🔎
        </div>

        <h1>Search Profiles</h1>

        <p>
          Find verified profiles that have chosen to be publicly searchable.
        </p>

      </div>

      <div class="search-tabs">

        <button
          type="button"
          id="phoneTab"
          class="search-tab active"
        >
          📱 Phone Number
        </button>

        <button
          type="button"
          id="facebookTab"
          class="search-tab"
        >
          Facebook URL
        </button>

      </div>

      <form id="searchForm">

        <div class="search-input-row">

          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Enter phone number"
            autocomplete="off"
            required
          >

          <button
            type="submit"
            id="searchBtn"
            class="search-btn"
          >
            Search
          </button>

        </div>

      </form>

      <div class="search-note">
        🔐 Only verified, active profiles with public search enabled
        can appear in results.
      </div>

      <div id="results" class="results"></div>

    </section>

  </div>

</main>

<script type="module">

import {
  searchProfiles
} from "./firebase.js";


const searchForm =
  document.getElementById("searchForm");

const searchInput =
  document.getElementById("searchInput");

const searchBtn =
  document.getElementById("searchBtn");

const phoneTab =
  document.getElementById("phoneTab");

const facebookTab =
  document.getElementById("facebookTab");

const results =
  document.getElementById("results");


let searchType = "phone";


phoneTab.addEventListener("click", () => {

  searchType = "phone";

  phoneTab.classList.add("active");
  facebookTab.classList.remove("active");

  searchInput.placeholder =
    "Enter phone number";

  searchInput.value = "";

  searchInput.focus();

});


facebookTab.addEventListener("click", () => {

  searchType = "facebook";

  facebookTab.classList.add("active");
  phoneTab.classList.remove("active");

  searchInput.placeholder =
    "Enter Facebook profile URL";

  searchInput.value = "";

  searchInput.focus();

});


function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function maskPhone(phone) {

  if (!phone) {
    return "Verified phone";
  }

  const value = String(phone);

  if (value.length <= 7) {
    return value;
  }

  return (
    value.substring(0, 4) +
    "••••" +
    value.substring(value.length - 3)
  );
}


function formatRelationship(status) {

  if (!status) {
    return "Not specified";
  }

  const map = {

    single: "Single",

    relationship:
      "In a Relationship",

    engaged:
      "Engaged",

    married:
      "Married",

    complicated:
      "It's Complicated"

  };

  return map[status] || status;
}


function renderResults(data) {

  if (!data.length) {

    results.innerHTML = `
      <div class="empty-result">
        <h3>No Profile Found</h3>
        <p>
          No verified public profile matched your search.
        </p>
      </div>
    `;

    return;
  }


  results.innerHTML = `
    <h2 class="results-title">
      Search Results
    </h2>

    ${data.map(profile => {

      const name =
        escapeHTML(
          profile.fullName ||
          "Loveroyality User"
        );

      const username =
        profile.username
          ? "@" + escapeHTML(profile.username)
          : "Verified Member";

      const relationship =
        escapeHTML(
          formatRelationship(
            profile.relationshipStatus ||
            profile.relationship
          )
        );

      const phone =
        escapeHTML(
          maskPhone(profile.phone)
        );

      const facebook =
        profile.facebookUrl
          ? `
            <a
              href="${escapeHTML(profile.facebookUrl)}"
              target="_blank"
              rel="noopener noreferrer"
              class="result-facebook"
            >
              View Facebook Profile
            </a>
          `
          : "";

      return `
        <article class="profile-result-card">

          <div class="result-avatar">
            ${escapeHTML(
              (profile.fullName || "❤️")
                .charAt(0)
                .toUpperCase()
            )}
          </div>

          <div class="result-info">

            <h3>${name}</h3>

            <p>
              ${username}
            </p>

            <span class="verified-result">
              ✓ Verified Profile
            </span>

            <br>

            ${facebook}

          </div>

          <div class="result-relationship">

            <small>
              Relationship
            </small>

            <strong>
              ${relationship}
            </strong>

            <small>
              ${phone}
            </small>

          </div>

          <button
            type="button"
            class="view-profile-btn"
            data-id="${escapeHTML(profile.id)}"
          >
            View Profile
          </button>

        </article>
      `;

    }).join("")}
  `;


  document
    .querySelectorAll(".view-profile-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const id =
            button.dataset.id;

          if (id) {
            window.location.href =
              `profile.html?id=${encodeURIComponent(id)}`;
          }

        }
      );

    });

}


searchForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    let value =
      searchInput.value.trim();

    if (!value) {

      results.innerHTML = `
        <div class="search-error">
          Please enter something to search.
        </div>
      `;

      return;
    }


    if (searchType === "phone") {

      value =
        value.replace(/\s+/g, "");

      if (value.startsWith("0")) {

        value =
          "+880" +
          value.substring(1);

      }

      if (
        !value.startsWith("+") ||
        value.length < 8
      ) {

        results.innerHTML = `
          <div class="search-error">
            Please enter a valid phone number.
          </div>
        `;

        return;
      }

    } else {

      if (
        !value.includes("facebook.com")
      ) {

        results.innerHTML = `
          <div class="search-error">
            Please enter a valid Facebook profile URL.
          </div>
        `;

        return;
      }

    }


    searchBtn.disabled = true;
    searchBtn.textContent = "Searching...";

    results.innerHTML = `
      <div class="search-loading">
        Searching verified profiles...
      </div>
    `;


    try {

      const data =
        await searchProfiles(value);

      renderResults(data);

    } catch (error) {

      console.error(error);

      results.innerHTML = `
        <div class="search-error">
          Search failed. Please try again.
        </div>
      `;

    } finally {

      searchBtn.disabled = false;
      searchBtn.textContent = "Search";

    }

  }
);

</script>

</body>
</html>
