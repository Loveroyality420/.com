<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Loveroyality</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <a href="index.html" class="logo">Loveroyality</a>

  <nav>
    <a href="login.html">Login</a>
    <a href="register.html" class="nav-btn">Create Profile</a>
  </nav>
</header>

<main class="auth-page">

  <section class="auth-card">

    <div class="auth-heading">
      <span class="auth-icon">♥</span>
      <h1>Welcome Back</h1>
      <p>Login securely with your verified phone number.</p>
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label for="phoneNumber">Phone Number</label>

        <div class="phone-row">

          <select id="countryCode">
            <option value="+880">🇧🇩 +880</option>
            <option value="+91">🇮🇳 +91</option>
            <option value="+92">🇵🇰 +92</option>
            <option value="+1">🇺🇸 +1</option>
            <option value="+44">🇬🇧 +44</option>
          </select>

          <input
            type="tel"
            id="phoneNumber"
            placeholder="1XXXXXXXXX"
            autocomplete="tel"
            required
          >

        </div>
      </div>

      <div id="recaptcha-container"></div>

      <button
        type="submit"
        id="sendLoginOtpBtn"
        class="primary-btn"
      >
        Send Login OTP
      </button>

    </form>

    <div
      id="otpSection"
      class="otp-section"
      style="display:none;"
    >

      <div class="otp-heading">
        <h2>Verify Your Phone</h2>

        <p>
          Enter the 6-digit OTP sent to your phone.
        </p>
      </div>

      <form id="otpForm">

        <div class="form-group">

          <label for="otpCode">
            Verification Code
          </label>

          <input
            type="text"
            id="otpCode"
            inputmode="numeric"
            maxlength="6"
            placeholder="000000"
            autocomplete="one-time-code"
            required
          >

        </div>

        <button
          type="submit"
          class="primary-btn"
        >
          Verify & Login
        </button>

      </form>

      <button
        type="button"
        id="resendOtpBtn"
        class="secondary-btn"
      >
        Resend OTP
      </button>

    </div>

    <div class="auth-footer">

      Don't have a profile?

      <a href="register.html">
        Create Profile
      </a>

    </div>

  </section>

</main>

<script type="module">

import {
  auth,
  sendOTP,
  verifyOTP,
  getProfile
} from "./firebase.js";

const loginForm =
  document.getElementById("loginForm");

const otpSection =
  document.getElementById("otpSection");

const otpForm =
  document.getElementById("otpForm");

const resendOtpBtn =
  document.getElementById("resendOtpBtn");

let confirmationResult = null;
let phoneForOtp = "";

function normalizePhone(countryCode, phone) {

  phone = phone.replace(/\D/g, "");

  if (phone.startsWith("0")) {
    phone = phone.substring(1);
  }

  return countryCode + phone;
}

function message(text, type = "info") {

  const old =
    document.querySelector(".app-message");

  if (old) old.remove();

  const box =
    document.createElement("div");

  box.className =
    `app-message ${type}`;

  box.textContent = text;

  document.body.prepend(box);

  setTimeout(() => {
    box.remove();
  }, 4000);
}

async function sendLoginOTP() {

  const countryCode =
    document.getElementById("countryCode").value;

  const phone =
    document.getElementById("phoneNumber").value.trim();

  phoneForOtp =
    normalizePhone(countryCode, phone);

  if (phoneForOtp.length < 8) {

    message(
      "Please enter a valid phone number.",
      "error"
    );

    return;
  }

  const button =
    document.getElementById("sendLoginOtpBtn");

  button.disabled = true;
  button.textContent = "Sending OTP...";

  try {

    confirmationResult =
      await sendOTP(
        phoneForOtp,
        "sendLoginOtpBtn"
      );

    loginForm.style.display = "none";

    otpSection.style.display = "block";

    message(
      "Login OTP sent successfully.",
      "success"
    );

  } catch (error) {

    console.error(error);

    button.disabled = false;

    button.textContent =
      "Send Login OTP";

    message(
      error.message ||
      "Unable to send OTP.",
      "error"
    );
  }
}

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    await sendLoginOTP();
  }
);

otpForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const code =
      document.getElementById("otpCode")
      .value
      .trim();

    if (code.length !== 6) {

      message(
        "Please enter the 6-digit OTP.",
        "error"
      );

      return;
    }

    const button =
      otpForm.querySelector(
        "button[type='submit']"
      );

    button.disabled = true;
    button.textContent = "Verifying...";

    try {

      if (!confirmationResult) {
        throw new Error(
          "OTP session expired. Please request a new OTP."
        );
      }

      const result =
        await confirmationResult.confirm(code);

      const user =
        result.user;

      const profile =
        await getProfile(user.uid);

      if (!profile) {

        message(
          "Your phone is verified, but no Loveroyality profile was found.",
          "error"
        );

        return;
      }

      message(
        "Login successful.",
        "success"
      );

      setTimeout(() => {

        window.location.href =
          `profile.html?uid=${encodeURIComponent(user.uid)}`;

      }, 800);

    } catch (error) {

      console.error(error);

      button.disabled = false;

      button.textContent =
        "Verify & Login";

      message(
        error.message ||
        "Invalid or expired OTP.",
        "error"
      );
    }
  }
);

resendOtpBtn.addEventListener(
  "click",
  async function() {

    if (!phoneForOtp) return;

    try {

      confirmationResult =
        await sendOTP(
          phoneForOtp,
          "resendOtpBtn"
        );

      message(
        "A new login OTP has been sent.",
        "success"
      );

    } catch (error) {

      console.error(error);

      message(
        error.message ||
        "Unable to resend OTP.",
        "error"
      );
    }
  }
);

</script>

</body>
</html>
