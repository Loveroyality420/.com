<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Loveroyality</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <a href="index.html" class="logo">Loveroyality ❤️</a>

  <nav>
    <a href="index.html">Home</a>
    <a href="search.html">Search</a>
    <a href="register.html" class="nav-btn">Create Profile</a>
  </nav>
</header>

<main class="auth-page">

  <section class="auth-card">

    <div class="auth-heading">
      <div class="auth-icon">❤️</div>
      <h1>Welcome Back</h1>
      <p>Login securely with your verified phone number.</p>
    </div>

    <div id="messageBox" class="app-message" style="display:none;"></div>

    <form id="loginForm">

      <div class="form-group">
        <label for="countryCode">Country</label>

        <div class="phone-row">

          <select id="countryCode" required>
            <option value="+880">🇧🇩 +880</option>
            <option value="+91">🇮🇳 +91</option>
            <option value="+92">🇵🇰 +92</option>
            <option value="+1">🇺🇸 +1</option>
            <option value="+44">🇬🇧 +44</option>
            <option value="+971">🇦🇪 +971</option>
            <option value="+966">🇸🇦 +966</option>
            <option value="+974">🇶🇦 +974</option>
            <option value="+61">🇦🇺 +61</option>
            <option value="+81">🇯🇵 +81</option>
          </select>

          <input
            type="tel"
            id="phoneNumber"
            placeholder="Phone number"
            autocomplete="tel"
            required
          >

        </div>
      </div>

      <button
        type="submit"
        id="sendLoginOtpBtn"
        class="primary-btn"
      >
        Send OTP
      </button>

    </form>

    <section id="otpSection" class="otp-section" style="display:none;">

      <div class="otp-heading">
        <h2>Verify Your Phone</h2>
        <p>Enter the 6-digit OTP sent to your phone.</p>
      </div>

      <form id="otpForm">

        <div class="form-group">
          <label for="otpCode">OTP Code</label>

          <input
            type="text"
            id="otpCode"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="••••••"
            required
          >
        </div>

        <button
          type="submit"
          id="verifyOtpBtn"
          class="primary-btn"
        >
          Verify & Login
        </button>

        <button
          type="button"
          id="resendOtpBtn"
          class="secondary-btn"
        >
          Resend OTP
        </button>

      </form>

    </section>

    <div class="auth-footer">
      Don't have a profile?
      <a href="register.html">Create Profile</a>
    </div>

  </section>

</main>

<script type="module">

import {
  sendOTP,
  verifyOTP,
  getProfile
} from "./firebase.js";

const loginForm = document.getElementById("loginForm");
const otpForm = document.getElementById("otpForm");

const countryCode = document.getElementById("countryCode");
const phoneNumber = document.getElementById("phoneNumber");

const otpSection = document.getElementById("otpSection");
const otpCode = document.getElementById("otpCode");

const sendLoginOtpBtn = document.getElementById("sendLoginOtpBtn");
const verifyOtpBtn = document.getElementById("verifyOtpBtn");
const resendOtpBtn = document.getElementById("resendOtpBtn");

const messageBox = document.getElementById("messageBox");

let currentPhone = "";

function showMessage(message, type = "info") {
  messageBox.textContent = message;
  messageBox.className = `app-message ${type}`;
  messageBox.style.display = "block";

  setTimeout(() => {
    messageBox.style.display = "none";
  }, 5000);
}

function getFullPhoneNumber() {

  let number = phoneNumber.value.trim();

  number = number.replace(/\s+/g, "");

  if (number.startsWith("0")) {
    number = number.substring(1);
  }

  return countryCode.value + number;
}

loginForm.addEventListener("submit", async (event) => {

  event.preventDefault();

  const phone = getFullPhoneNumber();

  if (!phoneNumber.value.trim()) {
    showMessage("Please enter your phone number.", "error");
    return;
  }

  currentPhone = phone;

  sendLoginOtpBtn.disabled = true;
  sendLoginOtpBtn.textContent = "Sending OTP...";

  try {

    await sendOTP(phone, "sendLoginOtpBtn");

    otpSection.style.display = "block";
    loginForm.style.display = "none";

    otpCode.focus();

    showMessage(
      "OTP has been sent to your phone.",
      "success"
    );

  } catch (error) {

    console.error(error);

    showMessage(
      error.message || "Failed to send OTP. Please try again.",
      "error"
    );

    sendLoginOtpBtn.disabled = false;
    sendLoginOtpBtn.textContent = "Send OTP";
  }

});

otpForm.addEventListener("submit", async (event) => {

  event.preventDefault();

  const code = otpCode.value.trim();

  if (code.length !== 6) {
    showMessage("Please enter the 6-digit OTP.", "error");
    return;
  }

  verifyOtpBtn.disabled = true;
  verifyOtpBtn.textContent = "Verifying...";

  try {

    const result = await verifyOTP(code);

    if (!result || !result.user) {
      throw new Error("Login verification failed.");
    }

    const uid = result.user.uid;

    const profile = await getProfile(uid);

    if (!profile) {

      showMessage(
        "No profile found for this phone number. Please create a profile first.",
        "error"
      );

      verifyOtpBtn.disabled = false;
      verifyOtpBtn.textContent = "Verify & Login";

      setTimeout(() => {
        window.location.href = "register.html";
      }, 1800);

      return;
    }

    if (
      profile.profileStatus !== "active" ||
      profile.phoneVerified !== true
    ) {

      showMessage(
        "Your profile is not currently active or verified.",
        "error"
      );

      verifyOtpBtn.disabled = false;
      verifyOtpBtn.textContent = "Verify & Login";

      return;
    }

    showMessage(
      "Login successful. Welcome to Loveroyality ❤️",
      "success"
    );

    setTimeout(() => {
      window.location.href = "profile.html";
    }, 1000);

  } catch (error) {

    console.error(error);

    showMessage(
      error.message || "Invalid OTP. Please try again.",
      "error"
    );

    verifyOtpBtn.disabled = false;
    verifyOtpBtn.textContent = "Verify & Login";
  }

});

resendOtpBtn.addEventListener("click", async () => {

  if (!currentPhone) {
    showMessage("Please enter your phone number first.", "error");
    return;
  }

  resendOtpBtn.disabled = true;
  resendOtpBtn.textContent = "Sending...";

  try {

    await sendOTP(currentPhone, "resendOtpBtn");

    otpCode.value = "";
    otpCode.focus();

    showMessage(
      "A new OTP has been sent.",
      "success"
    );

  } catch (error) {

    console.error(error);

    showMessage(
      error.message || "Could not resend OTP.",
      "error"
    );

  } finally {

    setTimeout(() => {
      resendOtpBtn.disabled = false;
      resendOtpBtn.textContent = "Resend OTP";
    }, 1500);

  }

});

phoneNumber.addEventListener("input", () => {

  phoneNumber.value = phoneNumber.value.replace(
    /[^0-9]/g,
    ""
  );

});

otpCode.addEventListener("input", () => {

  otpCode.value = otpCode.value.replace(
    /[^0-9]/g,
    ""
  );

});

</script>

</body>
</html>
